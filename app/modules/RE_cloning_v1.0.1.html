<section class="pane" id="re-cloning-pane">
      <div class="grid cols-2" id="top-grid">
        <div id="left-panel">
          <label style="margin-bottom:13px;display:flex;align-items:center;gap:8px">
            <strong data-i18n="ui.vectorSequence">Vector sequence (FASTA)</strong>
            <span class="help-icon" tabindex="0" aria-label="Help: Vector sequence" data-i18n-aria-label="ui.helpVector">
              <span>?</span>
              <span class="help-tooltip" data-i18n-html="ui.vectorHelpHtml">
                <strong style="display:block;margin-bottom:6px;">Vector sequence input</strong>
                <strong>Formats:</strong> FASTA (optional <code>&gt;</code>), plain DNA, or GenBank (<code>.gb</code>, <code>.gbk</code>, <code>.gbff</code>, <code>.genbank</code>) with <code>LOCUS</code> and <code>ORIGIN</code>. The <strong>LOCUS</strong> name is used as the short sequence name. <strong data-i18n="ui.upload">Upload</strong> without a header uses the <strong>file name</strong> (no extension) as <code>&gt;</code>name. SnapGene <code>.dna</code> is binary—export as GenBank or FASTA first. Whitespace ignored. Use Upload or Reverse complement as needed.
              </span>
            </span>
          </label>
          <textarea id="gg-vector" placeholder=">pESC-His&#10;GAGCAGACAA..." style="min-height:100px"></textarea>
          <div class="row end fasta-actions">
            <input type="file" id="file-vector" accept=".fa,.fasta,.fas,.txt,.gb,.gbk,.gbff,.genbank" style="display:none">
            <button type="button" class="btn demo" id="vector-flip-btn" data-i18n="ui.reverseComplement">Reverse complement</button>
            <button class="btn demo" id="btn-vector-demo" type="button" data-sample="vector" data-i18n="ui.demo">Demo</button>
            <button class="ghost btn" id="btn-vector-upload" type="button" data-i18n="ui.upload">Upload</button>
          </div>
        </div>
        <div id="right-panel">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:13px;">
            <label style="display:flex;align-items:center;gap:8px; margin:0">
              <strong data-i18n="ui.insertSequence">Insert sequence (FASTA)</strong>
              <span class="help-icon" tabindex="0" aria-label="Help: Insert sequence" data-i18n-aria-label="ui.helpInsert">
                <span>?</span>
                <span class="help-tooltip" data-i18n-html="re.insertHelpHtml">
                  <strong style="display:block;margin-bottom:6px;">Insert sequences</strong>
                  Same formats as vector (FASTA, plain DNA, GenBank <code>.gb</code>/<code>.gbk</code>/<code>.gbff</code>/<code>.genbank</code>; file name as header when missing). The tool designs primers to amplify the insert with restriction sites compatible with the selected enzymes.
                </span>
              </span>
            </label>
            <div class="module-primary-actions">
              <button class="demo btn" id="gg-demo-set" type="button" data-i18n="ui.demoSet">Demo Set</button>
              <button class="ghost btn" id="global-reset" type="button" data-i18n="ui.reset">Reset</button>
            </div>
          </div>
          <div id="inserts-container">
            <div class="insert-row" data-index="0" style="display:flex;gap:8px;">
              <div class="insert-label" style="flex-shrink: 0; white-space: nowrap; margin-top: 0;" data-i18n="ui.insertOneColon">Insert #1:</div>
              <div class="insert-body" style="flex: 1;">
                <textarea class="insert-seq" placeholder=">yeGFP&#10;ATGTCTAAAG..." style="min-height:100px"></textarea>
                <div class="row end fasta-actions">
                  <input type="file" class="insert-file" accept=".fa,.fasta,.fas,.txt,.gb,.gbk,.gbff,.genbank" style="display:none;">
                  <button type="button" class="btn demo insert-flip-btn" data-i18n="ui.reverseComplement">Reverse complement</button>
                  <button class="btn demo insert-demo-btn" type="button" data-sample="insert" data-i18n="ui.demo">Demo</button>
                  <button class="ghost btn insert-upload-btn" type="button" data-i18n="ui.upload">Upload</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

  <div class="grid cols-2" style="margin-top:16px;align-items:stretch">
    <div class="box" id="vector-preview-box">

      <h3 style="margin-top:16px;margin-bottom:12px" data-i18n="ui.primerParams">Primer Design Parameters</h3>
      <div class="grid cols-3" style="margin-top:10px; gap: 12px;">
        <div>
          <label class="aside" style="display:flex;align-items:center;gap:6px">
            <span data-i18n="re.protectiveBase">Protective base (5' clamp)</span>
            <span class="help-icon" tabindex="0" aria-label="Help: Protective base" data-i18n-aria-label="re.helpProtective">
              <span>?</span>
              <span class="help-tooltip" data-i18n-html="ui.protectiveHelp">Extra bases added to the 5' end of primers to improve restriction enzyme digestion efficiency. Typical values: 2–6.</span>
            </span>
          </label>
          <input id="gg-clamp" type="number" value="5" min="0" max="10" step="1">
        </div>
        <div>
          <label class="aside" style="display:flex;align-items:center;gap:6px">
            <span data-i18n="ui.targetTm">Target Tm (°C)</span>
            <span class="help-icon" tabindex="0" aria-label="Help: Target Tm" data-i18n-aria-label="re.helpTargetTm">
              <span>?</span>
              <span class="help-tooltip" data-i18n-html="ui.targetTmHelp">Target melting temperature for the core (annealing) region of each primer. Primers are optimized to be close to this value.</span>
            </span>
          </label>
          <input id="gg-tmTarget" type="number" value="55" step="0.1">
        </div>
        <div>
          <label class="aside" style="display:flex;align-items:center;gap:6px">
            <span data-i18n="ui.primerConc">Primer conc. (nM)</span>
            <span class="help-icon" tabindex="0" aria-label="Help: Primer concentration" data-i18n-aria-label="re.helpPrimerConc">
              <span>?</span>
              <span class="help-tooltip" data-i18n-html="ui.primerConcHelp">Effective primer concentration assumed for in silico Tm calculation. Typical range: 25-1000 nM.</span>
            </span>
          </label>
          <input id="gg-conc" type="number" value="500" step="10">
        </div>
      </div>
      <div class="grid cols-2" style="margin-top:12px; gap: 12px;">

            </span>
          </label>
          <input id="gg-na" type="number" value="50" step="1">
        </div>
        <div>
